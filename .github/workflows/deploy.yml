name: Build and deploy app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Keep previously generated optional audio
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:audio 2>/dev/null; then
              git archive FETCH_HEAD audio | tar -x -C public
            fi
          fi
      - run: npm run build
      - name: Publish the built app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm exec -- gh-pages -d dist --nojekyll -m "Deploy ${GITHUB_SHA}"
      - name: Check the Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          result = subprocess.run(['gh', 'api', f'repos/{repository}/pages'], text=True, capture_output=True)
          if result.returncode:
              message = (result.stderr + result.stdout).strip()
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=GitHub Pages configuration::{message}')
              raise SystemExit(result.returncode)
          current = json.loads(result.stdout)
          print(f"::notice::Current Pages source: {current.get('source')}, build type: {current.get('build_type')}")
          if current.get('source') != {'branch': 'gh-pages', 'path': '/'} or current.get('build_type') != 'legacy':
              message = f'Select Deploy from a branch, gh-pages, /(root) at https://github.com/{repository}/settings/pages. The workflow token cannot change this repository setting.'
              print(f'::error title=Select the built app as Pages source::{message}')
              raise SystemExit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Pages source: gh-pages / (legacy)\n')
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pages_commit="$(git ls-remote origin refs/heads/gh-pages | cut -f1)"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status, url}'; then
            latest_commit="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.commit')"
            latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')"
            if [[ "$latest_commit" != "$pages_commit" || ! "$latest_status" =~ ^(queued|building|built)$ ]]; then
              exit 1
            fi
          fi
          printf '\nPublished app version: %s\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_STEP_SUMMARY"
