name: Build and deploy app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Keep previously generated optional audio
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:audio 2>/dev/null; then
              git archive FETCH_HEAD audio | tar -x -C public
            fi
          fi
      - run: npm run build
      - name: Publish the built app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm exec -- gh-pages -d dist --nojekyll -m "Deploy ${GITHUB_SHA}"
      - name: Check and select the built Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          def api(method, payload=None):
              command = ['gh', 'api', '--method', method, endpoint]
              if payload is not None:
                  command += ['--input', '-']
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None, text=True, capture_output=True)
              if result.returncode:
                  message = (result.stderr + result.stdout).strip()
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=GitHub Pages configuration::{message}')
                  raise SystemExit(result.returncode)
              return json.loads(result.stdout)

          current = api('GET')
          print(f"::notice::Current Pages source: {current.get('source')}, build type: {current.get('build_type')}")
          if current.get('source') != {'branch': 'gh-pages', 'path': '/'} or current.get('build_type') != 'legacy':
              api('PUT', {'source': {'branch': 'gh-pages', 'path': '/'}, 'build_type': 'legacy'})
          selected = api('GET')
          assert selected['source'] == {'branch': 'gh-pages', 'path': '/'}, selected['source']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Pages source: gh-pages / (legacy)\n')
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pages_commit="$(git ls-remote origin refs/heads/gh-pages | cut -f1)"
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status, url}'; then
            latest_commit="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.commit')"
            latest_status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')"
            if [[ "$latest_commit" != "$pages_commit" || ! "$latest_status" =~ ^(queued|building|built)$ ]]; then
              exit 1
            fi
          fi
          printf '\nPublished app version: %s\n' "$(node -p 'require("./package.json").version')" >> "$GITHUB_STEP_SUMMARY"
